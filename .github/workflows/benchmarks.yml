name: Benchmarks

# Runs only when code that affects the results changes.
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'rust/**'
      - 'csharp/**'
      - 'scripts/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'rust/**'
      - 'csharp/**'
      - 'scripts/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: password
  # Full benchmarks on the main branch; a quick run checks pull requests
  # (see also the `background` matrices below).
  BENCHMARK_LINKS: ${{ github.event_name == 'pull_request' && '100' || '1000' }}

# A newer run of the same branch makes the older one obsolete: every job below
# cancels the same job of an older run. This is set per job, so a run that
# skips its jobs (see `changes`) does not cancel an older run.
jobs:
  # For a push to a pull request, GitHub checks the `paths` above against all
  # changes of the pull request, so this job checks the files of the push
  # itself. The pattern is the same list of paths.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE: repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }}
        run: |
          if [ "${{ github.event.action }}" != synchronize ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif ! files=$(gh api "$COMPARE" --jq '.files[].filename'); then
            echo "Cannot compare with the previous push, running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Files changed by the push:"
            echo "$files"
            if grep -qE '^(rust/|csharp/|scripts/|rust-toolchain\.toml$|\.github/workflows/benchmarks\.yml$)' <<< "$files"; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "No code changed, skipping the tests and benchmarks"
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j: &neo4j
        image: neo4j:2026.09-community
        env:
          NEO4J_AUTH: neo4j/password
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 7687:7687
          - 7474:7474
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test (all stores give the same results)
        run: cargo test --release -- --include-ignored
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Test the report generator
        working-directory: .
        run: |
          pip install matplotlib
          python3 -m unittest discover -s scripts -v

  test-csharp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-csharp
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j: *neo4j
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: csharp/global.json
      - name: Format
        run: dotnet format --verify-no-changes
      - name: Build (warnings are errors)
        run: dotnet build -c Release
      - name: Test (all stores give the same results)
        run: dotnet test -c Release --no-build

  benchmark-neo4j:
    needs: [test, test-csharp]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-neo4j-${{ matrix.language }}-${{ matrix.background }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        language: [rust, csharp]
        background: ${{ fromJSON(github.event_name == 'pull_request' && '[1000]' || '[10000, 100000, 1000000]') }}
        include:
          - language: rust
            benchmark: cargo bench --bench bench -- --output-format bencher --noplot
          - language: csharp
            benchmark: dotnet run -c Release --no-build --project Neo4jVSDoublets
    services:
      neo4j: *neo4j
    defaults:
      run:
        working-directory: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: csharp/global.json
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build -c Release
      - name: Run benchmark
        env:
          BENCHMARK_BACKEND: neo4j
          BENCHMARK_BACKGROUND_LINKS: ${{ matrix.background }}
          # Rust only: a fresh directory, because Criterion compares with an older
          # result if one exists, and the directories restored by the cache are incomplete.
          CRITERION_HOME: ${{ runner.temp }}/criterion
        run: |
          set -o pipefail
          { ../scripts/benchmark_header.sh neo4j
            ${{ matrix.benchmark }}
          } | tee ${{ matrix.language }}-${{ matrix.background }}-neo4j.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.language }}-${{ matrix.background }}-neo4j
          path: ${{ matrix.language }}/${{ matrix.language }}-${{ matrix.background }}-neo4j.txt

  benchmark-doublets:
    needs: [test, test-csharp]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-doublets-${{ matrix.language }}-${{ matrix.background }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        language: [rust, csharp]
        background: ${{ fromJSON(github.event_name == 'pull_request' && '[1000]' || '[10000, 100000, 1000000]') }}
        include:
          - language: rust
            benchmark: cargo bench --bench bench -- --output-format bencher --noplot
          - language: csharp
            benchmark: dotnet run -c Release --no-build --project Neo4jVSDoublets
    defaults:
      run:
        working-directory: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: csharp/global.json
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build -c Release
      - name: Run benchmark
        env:
          BENCHMARK_BACKEND: doublets
          BENCHMARK_BACKGROUND_LINKS: ${{ matrix.background }}
          # Rust only: a fresh directory, because Criterion compares with an older
          # result if one exists, and the directories restored by the cache are incomplete.
          CRITERION_HOME: ${{ runner.temp }}/criterion
        run: |
          set -o pipefail
          { ../scripts/benchmark_header.sh doublets
            ${{ matrix.benchmark }}
          } | tee ${{ matrix.language }}-${{ matrix.background }}-doublets.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.language }}-${{ matrix.background }}-doublets
          path: ${{ matrix.language }}/${{ matrix.language }}-${{ matrix.background }}-doublets.txt

  report:
    needs: [benchmark-neo4j, benchmark-doublets]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-report
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          merge-multiple: true
          path: results
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Generate tables and charts
        run: |
          set -o pipefail
          pip install matplotlib
          python3 scripts/benchmark_report.py results --readme README.md --charts Docs | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: Benchmark results
          path: |
            results
            README.md
            Docs/bench_*.png
      - name: Commit results
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.email "linksplatform@gmail.com"
          git config user.name "LinksPlatformBencher"
          git add Docs README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update benchmark results"
            git push origin HEAD
          fi

name: Benchmark Rust version

# Runs only when code that affects the results changes.
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'rust/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'rust/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

# A newer run of the same branch makes the older one obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: password
  # Full benchmarks on the main branch; a quick run checks pull requests
  # (see also the `background` matrices below).
  BENCHMARK_LINKS: ${{ github.event_name == 'pull_request' && '100' || '1000' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j: &neo4j
        image: neo4j:2026.09-community
        env:
          NEO4J_AUTH: neo4j/password
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 7687:7687
          - 7474:7474
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test (all stores give the same results)
        run: cargo test --release -- --include-ignored

  benchmark-neo4j:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        background: ${{ fromJSON(github.event_name == 'pull_request' && '[1000]' || '[10000, 100000, 1000000]') }}
    services:
      neo4j: *neo4j
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run benchmark
        env:
          BENCHMARK_BACKEND: neo4j
          BENCHMARK_BACKGROUND_LINKS: ${{ matrix.background }}
          # A fresh directory: Criterion compares with an older result if one
          # exists, and the directories restored by the cache are incomplete.
          CRITERION_HOME: ${{ runner.temp }}/criterion
        run: |
          set -o pipefail
          cargo bench --bench bench -- --output-format bencher --noplot | tee ${{ matrix.background }}-neo4j.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.background }}-neo4j
          path: rust/${{ matrix.background }}-neo4j.txt

  benchmark-doublets:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        background: ${{ fromJSON(github.event_name == 'pull_request' && '[1000]' || '[10000, 100000, 1000000]') }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run benchmark
        env:
          BENCHMARK_BACKEND: doublets
          BENCHMARK_BACKGROUND_LINKS: ${{ matrix.background }}
          # A fresh directory: Criterion compares with an older result if one
          # exists, and the directories restored by the cache are incomplete.
          CRITERION_HOME: ${{ runner.temp }}/criterion
        run: |
          set -o pipefail
          cargo bench --bench bench -- --output-format bencher --noplot | tee ${{ matrix.background }}-doublets.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.background }}-doublets
          path: rust/${{ matrix.background }}-doublets.txt

  report:
    needs: [benchmark-neo4j, benchmark-doublets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          merge-multiple: true
          path: rust/results
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Generate tables and charts
        working-directory: rust
        run: |
          pip install numpy matplotlib
          python3 out.py
      - uses: actions/upload-artifact@v7
        with:
          name: Benchmark results
          path: |
            rust/results
            rust/results.md
            Docs/bench_rust_*.png
      - name: Commit results
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.email "linksplatform@gmail.com"
          git config user.name "LinksPlatformBencher"
          git add Docs README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update benchmark results"
            git push origin HEAD
          fi
